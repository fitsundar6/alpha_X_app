org.gradle.jvmargs=-Xmx4G -XX:MaxMetaspaceSize=2G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
# builtInKotlin MUST stay false until third-party plugins (health, pedometer)
# remove their own kotlin-android plugin declarations from their build.gradle files.
# AGP 9.1 with builtInKotlin=true rejects any plugin that still applies kotlin-android,
# causing: "Failed to apply plugin 'org.jetbrains.kotlin.android'"
# Track: https://github.com/cph-cachet/flutter-plugins/issues (health plugin)
android.builtInKotlin=false
