org.gradle.jvmargs=-Xmx4G -XX:MaxMetaspaceSize=2G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
# Enable built-in Kotlin support (required by modern Flutter / AGP 8+)
# This silences KGP compatibility warnings from plugins like health, pedometer, etc.
android.builtInKotlin=true
