name: Build iOS IPA & Android APK (Production)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch: # Allows manual trigger from GitHub UI

jobs:
  build-ios:
    name: 🍎 Build iOS Release
    runs-on: macos-14 # Apple Silicon cloud runner
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install Dependencies
        working-directory: apps/mobile
        run: flutter pub get

      - name: Verify Code Quality
        working-directory: apps/mobile
        run: flutter analyze

      - name: Build iOS Application (Release)
        working-directory: apps/mobile
        run: flutter build ios --release --no-codesign

      - name: Package Payload as IPA
        working-directory: apps/mobile
        run: |
          mkdir -p build/ios/iphoneos/Payload
          cp -r build/ios/iphoneos/Runner.app build/ios/iphoneos/Payload/
          cd build/ios/iphoneos
          zip -r AlphaXGym-Release.ipa Payload
          cd ../../..

      - name: Upload iOS IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AlphaXGym-iOS-Release
          path: apps/mobile/build/ios/iphoneos/AlphaXGym-Release.ipa
          retention-days: 14

  build-android:
    name: 🤖 Build Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install Dependencies
        working-directory: apps/mobile
        run: flutter pub get

      - name: Build Android Release APK
        working-directory: apps/mobile
        run: flutter build apk --release

      - name: Upload Android APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AlphaXGym-Android-Release
          path: apps/mobile/build/app/outputs/flutter-apk/app-release.apk
          retention-days: 14
