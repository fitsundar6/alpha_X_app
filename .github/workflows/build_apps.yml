name: Build iOS IPA & Android APK (Production)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch: # Allows manual trigger from GitHub UI

jobs:
  build-ios:
    name: 🍎 Build iOS Release
    runs-on: macos-14 # Apple Silicon cloud runner
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install Dependencies
        working-directory: apps/mobile
        run: flutter pub get

      - name: Patch camera_avfoundation for Xcode 16 / iOS 18
        run: |
          for f in $(find ~/.pub-cache -name "DefaultCamera.swift" 2>/dev/null); do
            echo "Patching $f for Xcode 16 compatibility..."
            sed -i '' 's/AVCaptureSession\.wasInterruptedNotification/NSNotification.Name("AVCaptureSessionWasInterruptedNotification")/g' "$f"
            sed -i '' 's/AVCaptureSession\.runtimeErrorNotification/NSNotification.Name("AVCaptureSessionRuntimeErrorNotification")/g' "$f"
          done

      - name: Verify Code Quality
        working-directory: apps/mobile
        run: flutter analyze

      - name: Build iOS Application (Release)
        working-directory: apps/mobile
        run: flutter build ios --release --no-codesign

      - name: Package Payload as IPA
        working-directory: apps/mobile
        run: |
          mkdir -p build/ios/iphoneos/Payload
          cp -r build/ios/iphoneos/Runner.app build/ios/iphoneos/Payload/
          cd build/ios/iphoneos
          zip -r AlphaXGym-Release.ipa Payload
          cd ../../..

      - name: Upload iOS IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AlphaXGym-iOS-Release
          path: apps/mobile/build/ios/iphoneos/AlphaXGym-Release.ipa
          retention-days: 14

  build-android:
    name: 🤖 Build Android APK & AAB
    runs-on: ubuntu-latest
    env:
      # Expose secret as env var so it can be used in step `if:` conditions
      # (secrets context is not available in step-level if expressions)
      KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install Android NDK
        # Explicitly install the NDK version declared in build.gradle.kts
        # This prevents "Release app bundle failed to strip debug symbols" errors
        # because the CI runner may not have the matching NDK pre-installed.
        uses: android-actions/setup-android@v3
        with:
          packages: 'ndk;28.2.13676358'

      - name: Install Dependencies
        working-directory: apps/mobile
        run: flutter pub get

      - name: Setup Release Signing (if secrets available)
        # Only runs when KEYSTORE_BASE64 secret is set in the repository.
        # Falls back to debug signing automatically when the secret is missing.
        # Note: must check env context (not secrets) in step-level if: expressions.
        if: ${{ env.KEYSTORE_BASE64 != '' }}
        working-directory: apps/mobile/android
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 --decode > app/keystore.jks
          cat > key.properties <<EOF
          storePassword=$KEYSTORE_PASSWORD
          keyPassword=$KEY_PASSWORD
          keyAlias=$KEY_ALIAS
          storeFile=keystore.jks
          EOF

      - name: Build Android Release APK
        # Note: Only APK is built in CI. AAB (App Bundle) is built locally and
        # uploaded manually to Google Play Console — the bundleRelease Gradle task
        # fails in CI due to a Flutter/NDK debug-symbol stripping bug with
        # third-party native plugins (health, pedometer) on ubuntu-latest runners.
        working-directory: apps/mobile
        env:
          # Cap Gradle heap — GitHub-hosted runners have ~7GB total RAM
          GRADLE_OPTS: "-Xmx4g -XX:MaxMetaspaceSize=2g"
        run: |
          flutter build apk --release

      - name: Upload Android APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AlphaXGym-Android-Release-APK
          path: apps/mobile/build/app/outputs/flutter-apk/app-release.apk
          retention-days: 14

  publish-release:
    name: 🚀 Publish GitHub Release
    needs: [build-ios, build-android]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download iOS IPA Artifact
        uses: actions/download-artifact@v4
        with:
          name: AlphaXGym-iOS-Release
          path: release-artifacts

      - name: Download Android APK Artifact
        uses: actions/download-artifact@v4
        with:
          name: AlphaXGym-Android-Release-APK
          path: release-artifacts

      - name: Rename Artifacts for Release
        run: |
          if [ -f "release-artifacts/app-release.apk" ]; then
            mv release-artifacts/app-release.apk release-artifacts/AlphaXGym-Release.apk
          fi

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.0
          name: "Alpha X Gym v1.0.0 (Production Release)"
          body: |
            ## Alpha X Gym — Production Release (v1.0.0)

            ### Included Binaries:
            * **iOS IPA:** `AlphaXGym-Release.ipa` (for iPhone / iPad installation via AltStore, Sideloadly, Scarlet, TrollStore, or Apple Configurator)
            * **Android APK:** `AlphaXGym-Release.apk` (direct sideload on Android — enable "Install from unknown sources")

            > **Google Play Console AAB:** Build locally with `flutter build appbundle --release` and upload manually.

            ### Features:
            * Real-time Gemini Foundation AI Coach integration
            * Automatic failover and LAN Wi-Fi backend fallback
            * Master Administrator controls and client performance tracking
          draft: false
          prerelease: false
          files: |
            release-artifacts/AlphaXGym-Release.ipa
            release-artifacts/AlphaXGym-Release.apk
