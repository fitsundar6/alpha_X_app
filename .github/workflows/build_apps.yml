name: Build iOS IPA & Android APK (Production)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch: # Allows manual trigger from GitHub UI

jobs:
  build-ios:
    name: 🍎 Build iOS Release
    runs-on: macos-14 # Apple Silicon cloud runner
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install Dependencies
        working-directory: apps/mobile
        run: flutter pub get

      - name: Patch camera_avfoundation for Xcode 16 / iOS 18
        run: |
          for f in $(find ~/.pub-cache -name "DefaultCamera.swift" 2>/dev/null); do
            echo "Patching $f for Xcode 16 compatibility..."
            sed -i '' 's/AVCaptureSession\.wasInterruptedNotification/NSNotification.Name("AVCaptureSessionWasInterruptedNotification")/g' "$f"
            sed -i '' 's/AVCaptureSession\.runtimeErrorNotification/NSNotification.Name("AVCaptureSessionRuntimeErrorNotification")/g' "$f"
          done

      - name: Verify Code Quality
        working-directory: apps/mobile
        run: flutter analyze

      - name: Build iOS Application (Release)
        working-directory: apps/mobile
        run: flutter build ios --release --no-codesign

      - name: Package Payload as IPA
        working-directory: apps/mobile
        run: |
          mkdir -p build/ios/iphoneos/Payload
          cp -r build/ios/iphoneos/Runner.app build/ios/iphoneos/Payload/
          cd build/ios/iphoneos
          zip -r AlphaXGym-Release.ipa Payload
          cd ../../..

      - name: Upload iOS IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AlphaXGym-iOS-Release
          path: apps/mobile/build/ios/iphoneos/AlphaXGym-Release.ipa
          retention-days: 14

  build-android:
    name: 🤖 Build Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install Dependencies
        working-directory: apps/mobile
        run: flutter pub get

      - name: Build Android Release APK
        working-directory: apps/mobile
        run: flutter build apk --release

      - name: Upload Android APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AlphaXGym-Android-Release
          path: apps/mobile/build/app/outputs/flutter-apk/app-release.apk
          retention-days: 14

  publish-release:
    name: 🚀 Publish GitHub Release
    needs: [build-ios, build-android]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download iOS IPA Artifact
        uses: actions/download-artifact@v4
        with:
          name: AlphaXGym-iOS-Release
          path: release-artifacts

      - name: Download Android APK Artifact
        uses: actions/download-artifact@v4
        with:
          name: AlphaXGym-Android-Release
          path: release-artifacts

      - name: Rename APK for Release
        run: |
          if [ -f "release-artifacts/app-release.apk" ]; then
            mv release-artifacts/app-release.apk release-artifacts/AlphaXGym-Release.apk
          fi

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.0
          name: "Alpha X Gym v1.0.0 (Production Release)"
          body: |
            ## Alpha X Gym — Production Release (v1.0.0)

            ### Included Binaries:
            * **iOS IPA:** `AlphaXGym-Release.ipa` (for iPhone / iPad installation via AltStore, Sideloadly, Scarlet, TrollStore, or Apple Configurator)
            * **Android APK:** `AlphaXGym-Release.apk` (direct install on Android devices)

            ### Features:
            * Real-time Gemini Foundation AI Coach integration
            * Automatic failover and LAN Wi-Fi backend fallback
            * Master Administrator controls and client performance tracking
          draft: false
          prerelease: false
          files: |
            release-artifacts/AlphaXGym-Release.ipa
            release-artifacts/AlphaXGym-Release.apk
