name: Build iOS IPA
on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'apps/mobile/**'
      - '.github/workflows/build_ios.yml'

jobs:
  build:
    runs-on: macos-15
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Enable Swift Package Manager
        run: flutter config --enable-swift-package-manager

      - name: Install Dependencies
        working-directory: apps/mobile
        run: flutter pub get

      - name: Fix device_info_plus visionOS compatibility
        run: |
          python3 -c "
          import glob, os
          pattern = os.path.expanduser('~/.pub-cache/**/FPPDeviceInfoPlusPlugin.m')
          files = glob.glob(pattern, recursive=True)
          for f in files:
              with open(f, 'r') as fp:
                  content = fp.read()
              if 'isiOSAppOnVision' in content:
                  content = content.replace('isiOSAppOnVision', 'isMacCatalystApp')
                  with open(f, 'w') as fp:
                      fp.write(content)
                  print(f'Successfully patched {f}')
          "

      - name: Build iOS App
        working-directory: apps/mobile
        run: flutter build ios --release --no-codesign

      - name: Package into IPA
        working-directory: apps/mobile
        run: |
          mkdir -p Payload
          cp -r build/ios/iphoneos/Runner.app Payload/
          zip -r ../../alpha_x_gym.ipa Payload

      - name: Upload IPA File
        uses: actions/upload-artifact@v4
        with:
          name: alpha_x_gym_ios
          path: alpha_x_gym.ipa
